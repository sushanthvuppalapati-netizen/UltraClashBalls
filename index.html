<!DOCTYPE html>
<html>
<head>
    <title>My Processing Game</title>
    <!-- Loads the Processing library into the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/processing.js/1.6.6/processing.min.js"></script>
</head>
<body>
<h1>UltraClashBalls</h1>
<!-- Tells Processing to run your sketch.pde file inside this canvas -->
<canvas data-processing-sources="sketch.pde GameConfig.pde LavaZone.pde MapBuilder.pde PowerUp.pde Tree.pde GameState.pde Bullet.pde Ball.pde"></canvas>
</body>
</html>
